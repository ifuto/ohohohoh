[package]
name = "rsgraphics"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RsGraphics: Official Rsift rendering mod (wgpu pipeline, 12-byte quantized vertices, Rayon meshing, GPU compute culling; shader-pack GLSL execution not implemented — built-in Eco WGSL fallback)"

[dependencies]
bytemuck.workspace = true
tracing.workspace = true
rayon.workspace = true
rsift-api = { path = "../../crates/rsift-api" }
rsift-render = { path = "../../crates/rsift-render" }
rsift-dx12 = { path = "../../crates/rsift-dx12" }
rsift-opt-gfx = { path = "../../crates/rsift-opt-gfx" }

[lib]
name = "rsgraphics"
crate-type = ["cdylib", "rlib"]
