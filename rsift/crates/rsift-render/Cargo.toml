[package]
name = "rsift-render"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "DirectX 12 Agility render engine (no OpenGL/Vulkan/wgpu)"

[dependencies]
tracing.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
rsift-api = { path = "../rsift-api" }
rsift-dx12 = { path = "../rsift-dx12" }
rsift-installer = { path = "../rsift-installer" }
rsift-opt-gfx = { path = "../rsift-opt-gfx" }

[lib]
name = "rsift_render"
crate-type = ["rlib", "cdylib"]
