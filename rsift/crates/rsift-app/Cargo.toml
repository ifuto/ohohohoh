[package]
name = "rsift-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Rsift glass launcher — offline, local install, aqua UI"

[[bin]]
name = "rsift-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
window-vibrancy = "0.5"
winit = "0.29"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rsift-launch = { path = "../rsift-launch" }
rsift-installer = { path = "../rsift-installer" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
