[package]
name = "rsift-replay"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RsReplay: Next-generation zero-copy packet replay system for Rsift"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
tracing.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rayon.workspace = true
glam.workspace = true
zstd.workspace = true
rsift-api = { path = "../rsift-api" }
rsift-render = { path = "../rsift-render" }

[features]
default = []
ffmpeg-cli = []

[lib]
name = "rsift_replay"
crate-type = ["rlib"]
