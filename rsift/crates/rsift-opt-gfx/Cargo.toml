[package]
name = "rsift-opt-gfx"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "HZB GPU-driven culling, 12-byte quantized meshing, and Iris shader pipeline for Rsift"

[dependencies]
bytemuck.workspace = true
tracing.workspace = true
rayon.workspace = true
wgpu.workspace = true
zstd.workspace = true
lz4_flex.workspace = true
parking_lot.workspace = true
hashbrown.workspace = true
crossbeam-channel.workspace = true
dashmap = "6.0"
smallvec.workspace = true
memmap2.workspace = true
rsift-api = { path = "../rsift-api" }
# iris シェーダーパック ZIP (method 8 = raw deflate) の実展開に使用
# (lock 上のエッジは dev-dependencies 時代から既存のため変更不要)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lib]
name = "rsift_opt_gfx"
crate-type = ["rlib"]

[dev-dependencies]
# WGSL の GPU 非依存パース検証 (frame_pipeline テスト) と例のログ出力用
# default-features + compact: wgpu の dev-deps 由来の tokio/proc-macro2 等が
# Cargo.lock 上の dev エッジに載るのを避けるため (lock 完全性の防衛)
naga = { version = "0.20", default-features = false, features = ["compact", "wgsl-in"] }
tracing-subscriber.workspace = true
