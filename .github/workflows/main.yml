name: vendor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'cargo vendor を実行する ref (Cargo.lock を含むブランチ)'
        required: true
        default: 'arena/019f79db-rsift'

permissions:
  contents: write # vendor ブランチへの push に必要

concurrency:
  group: vendor
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (lockfile の供給元 ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'arena/019f79db-rsift' }}
          persist-credentials: false

      - name: cargo vendor --locked
        run: |
          set -euo pipefail
          cd rsift
          cargo vendor --locked vendor > ../vendor-config.txt
          echo "vendored crates: $(ls vendor | wc -l)"

      - name: tar.gz 化 + 90MB 分割 (GitHub の 100MB/ファイル上限対策)
        run: |
          set -euo pipefail
          tar -czf vendor-parts.tar.gz -C rsift vendor
          mkdir -p out
          cd out
          split -b 90m -d -a 2 ../vendor-parts.tar.gz vendor.tar.gz.part-
          sha256sum vendor.tar.gz.part-* > SHA256SUMS
          cp ../vendor-config.txt VENDOR-CONFIG.txt
          { echo "### cargo vendor 結果"
            echo "- vendored crates: $(ls ../rsift/vendor | wc -l)"
            echo "- tarball size: $(du -h ../vendor-parts.tar.gz | cut -f1)"
            echo "- parts: $(ls vendor.tar.gz.part-* | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la

      - name: Rust toolchain 取得 (sandbox 用・公式 sha256 照合)
        run: |
          set -euo pipefail
          VER=1.94.1
          cd out
          curl -sSfL "https://static.rust-lang.org/dist/rust-${VER}-x86_64-unknown-linux-gnu.tar.xz" -o toolchain.tar.xz
          curl -sSfL "https://static.rust-lang.org/dist/rust-${VER}-x86_64-unknown-linux-gnu.tar.xz.sha256" -o toolchain.expect.sha256
          # 公式発行ハッシュと照合 (改ざん検知 — 照合失敗ならここで run 中断)
          awk '{print $1"  toolchain.tar.xz"}' toolchain.expect.sha256 | sha256sum -c -
          rm toolchain.expect.sha256
          split -b 90m -d -a 2 toolchain.tar.xz 
