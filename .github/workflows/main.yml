name: toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rust toolchain 取得 (公式 sha256 照合)
        run: |
          set -euo pipefail
          VER=1.94.1
          mkdir -p out && cd out
          curl -sSfL "https://static.rust-lang.org/dist/rust-${VER}-x86_64-unknown-linux-gnu.tar.xz" -o toolchain.tar.xz
          curl -sSfL "https://static.rust-lang.org/dist/rust-${VER}-x86_64-unknown-linux-gnu.tar.xz.sha256" -o expect.sha256
          awk '{print $1"  toolchain.tar.xz"}' expect.sha256 | sha256sum -c -
          split -b 90m -d -a 2 toolchain.tar.xz toolchain.tar.xz.part-
          sha256sum toolchain.tar.xz.part-* > TOOLCHAIN-SHA256SUMS
          rm toolchain.tar.xz expect.sha256

      - name: vendor ブランチへ追記 push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --branch vendor "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" vbr
          cd vbr
          cp ../out/toolchain.tar.xz.part-* .
          cp ../out/TOOLCHAIN-SHA256SUMS .
          git add -A
          git commit -qm "add rust toolchain parts"
          git push -q origin HEAD:refs/heads/vendor
