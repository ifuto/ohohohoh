<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rsift dev-assets 分割ツール (25MB/chunk)</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.3rem; }
  .drop { border: 2px dashed #888; border-radius: 12px; padding: 2.5rem 1rem; text-align: center; margin: 1rem 0; cursor: pointer; }
  .drop.over { border-color: #0a7; background: rgba(0,170,120,.08); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .8rem 0; }
  input[type=number] { width: 9rem; padding: .3rem; }
  button, .btn { padding: .45rem .9rem; border: 1px solid #888; border-radius: 8px; background: #0a7; color: #fff; cursor: pointer; text-decoration: none; font-size: .9rem; }
  button:disabled { background: #999; }
  .btn { background: #555; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  td, th { border-bottom: 1px solid #8883; padding: .3rem .5rem; text-align: left; }
  progress { width: 100%; height: 1rem; }
  code { background: #8882; padding: .1rem .35rem; border-radius: 4px; }
  #log { white-space: pre-wrap; font-size: .8rem; opacity: .85; max-height: 12rem; overflow: auto; }
  .warn { color: #c60; }
</style>
</head>
<body>
<h1>📦 Rsift dev-assets 分割ツール</h1>
<p>
巨大 ZIP / tarball を <b>25MB 刻み</b>に分割し、GitHub web アップロード上限を回避します。
全処理はブラウザ内オフライン完結 (ファイルは外部に送信されません)。
分割後は <code>dev-assets</code> ブランチの <code>assets/</code> に web UI でアップロードしてください。
</p>

<div id="drop" class="drop">
  <b>ここにファイルをドラッグ&amp;ドロップ</b><br>または クリックして選択
  <input type="file" id="file" style="display:none">
</div>

<div class="row">
  <label>1 パートのサイズ (bytes):
    <input type="number" id="chunk" value="25000000" min="1000000" step="1000000">
  </label>
  <button id="preset25">25MB (web UI 用)</button>
  <button id="preset90">90MB (git push 用)</button>
</div>

<div class="row">
  <button id="split" disabled>✂️ 分割する</button>
  <button id="dlAll" disabled>⬇ 全パート順次ダウンロード</button>
  <a class="btn" id="manifest" style="display:none" download="MANIFEST.txt">📄 MANIFEST.txt</a>
</div>

<progress id="prog" value="0" max="1" style="display:none"></progress>
<div id="log"></div>
<div id="result"></div>

<script>
"use strict";
// ================= 増分 SHA-256 (ストリーム対応・メモリ節約) =================
const K = new Uint32Array([
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
]);
const rotr = (x, n) => (x >>> n) | (x << (32 - n));

function sha256Create() {
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                             0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64);
  let buf = new Uint8Array(0), total = 0;
  function compress(blk, off) {
    const dv = new DataView(blk.buffer, blk.byteOffset + off, 64);
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3);
      const s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  function update(data) {
    total += data.length;
    const nb = new Uint8Array(buf.length + data.length);
    nb.set(buf); nb.set(data, buf.length); buf = nb;
    let off = 0;
    while (buf.length - off >= 64) { compress(buf, off); off += 64; }
    buf = buf.slice(off);
  }
  function finalize() {
    const hi = Math.floor((total * 8) / 4294967296), lo = (total * 8) % 4294967296;
    const padLen = (56 - ((total + 1) % 64) + 64) % 64;
    const pad = new Uint8Array(1 + padLen + 8); pad[0] = 0x80;
    new DataView(pad.buffer).setUint32(pad.length - 8, hi);
    new DataView(pad.buffer).setUint32(pad.length - 4, lo);
    const fin = new Uint8Array(buf.length + pad.length);
    fin.set(buf); fin.set(pad, buf.length);
    for (let off = 0; off < fin.length; off += 64) compress(fin, off);
    return Array.from(H, x => x.toString(16).padStart(8, "0")).join("");
  }
  return { update, finalize };
}
// =====================================================================

const $ = id => document.getElementById(id);
const fmtSize = n => n >= 1073741824 ? (n/1073741824).toFixed(2)+" GiB"
                 : n >= 1048576 ? (n/1048576).toFixed(2)+" MiB" : (n/1024).toFixed(1)+" KiB";
const log = m => { $("log").textContent += m + "\n"; };
let file = null, parts = [];

$("drop").onclick = () => $("file").click();
$("file").onchange = e => setFile(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
$("preset25").onclick = () => $("chunk").value = 25000000;
$("preset90").onclick = () => $("chunk").value = 94371840;

function setFile(f) {
  file = f;
  $("drop").innerHTML = "<b>" + f.name + "</b> (" + fmtSize(f.size) + ") — 変更するにはクリック/ドロップ";
  $("drop").onclick = () => $("file").click();
  $("split").disabled = false;
  $("result").innerHTML = ""; $("log").textContent = ""; parts.forEach(p => URL.revokeObjectURL(p.url)); parts = [];
  $("manifest").style.display = "none"; $("dlAll").disabled = true;
}

$("split").onclick = async () => {
  if (!file) return;
  const chunk = Math.max(1000000, parseInt($("chunk").value, 10) || 25000000);
  const count = Math.ceil(file.size / chunk);
  const digits = Math.max(3, String(count).length);
  $("split").disabled = true; $("prog").style.display = "block"; $("prog").value = 0;
  $("result").innerHTML = ""; $("log").textContent = "";
  log("対象: " + file.name + " (" + fmtSize(file.size) + ") / chunk=" + fmtSize(chunk) + " / " + count + " パート");

  // SHA-256 をストリームで計算 (全体をメモリに持たない)
  const hash = sha256Create();
  try {
    if (file.stream) {
      const reader = file.stream(chunk).getReader ? file.stream().getReader() : null;
      if (reader) { for (;;) { const {done, value} = await reader.read(); if (done) break; hash.update(value); } }
      else { hash.update(new Uint8Array(await file.arrayBuffer())); }
    } else { hash.update(new Uint8Array(await file.arrayBuffer())); }
  } catch (e) { log("⚠ ハッシュ計算エラー (続行): " + e); }
  const sha = hash.finalize();
  log("SHA-256: " + sha);

  for (let i = 0; i < count; i++) {
    const start = i * chunk;
    const blob = file.slice(start, Math.min(start + chunk, file.size));
    const name = file.name + "." + String(i + 1).padStart(digits, "0");
    parts.push({ name, size: blob.size, url: URL.createObjectURL(blob), blob });
    $("prog").value = (i + 1) / count;
    await new Promise(r => setTimeout(r, 0)); // UI 更新
  }

  // 結果一覧
  let html = "<table><tr><th>#</th><th>ファイル名</th><th>サイズ</th><th></th></tr>";
  parts.forEach((p, i) => {
    html += '<tr><td>' + (i+1) + '</td><td><code>' + p.name + '</code></td><td>' + fmtSize(p.size)
          + '</td><td><a class="btn" href="' + p.url + '" download="' + p.name + '">⬇ 保存</a></td></tr>';
  });
  html += "</table>";
  $("result").innerHTML = html;

  // MANIFEST (検証用)
  const mf = ["file: " + file.name, "size: " + file.size + " bytes", "sha256: " + sha,
    "chunk: " + chunk, "parts: " + count, "",
    ...parts.map((p, i) => String(i+1).padStart(digits,"0") + "  " + p.size + "  " + p.name)].join("\n");
  const ma = $("manifest");
  ma.href = URL.createObjectURL(new Blob([mf], {type: "text/plain"}));
  ma.style.display = "inline-block";
  $("dlAll").disabled = false; $("split").disabled = false;
  log("✅ 分割完了: " + count + " パート。dev-assets ブランチの assets/ にアップロードしてください。");
  if (count > 2 && !confirm) {} // noop
};

$("dlAll").onclick = async () => {
  if (!parts.length) return;
  if (!confirm(parts.length + " 個のファイルを順次ダウンロードします (ブラウザの複数DL許可が必要な場合があります)")) return;
  for (const p of parts) {
    const a = document.createElement("a");
    a.href = p.url; a.download = p.name; a.click();
    await new Promise(r => setTimeout(r, 700));
  }
  log("⬇ 全パートのダウンロードを指示しました。ブラウザのDL履歴を確認してください。");
};

if (new URLSearchParams(location.search).get("chunk")) $("chunk").value = new URLSearchParams(location.search).get("chunk");
</script>
</body>
</html>
