# GitHub Actions ワークフロー (有効化手順は ci/README.md 参照)
#
# private リポジトリ = Actions は月 2,000 分の無料枠 (Windows ランナーは 2倍消費)。
# そのため次のクォータ節約設計にしてある:
#   - check ジョブ (ubuntu, ×1, キャッシュあり): push 毎 (ただし md/docs 単独 push は除外)
#   - windows-installer ジョブ (重い LTO フルビルド, ×2 消費): **手動実行 (workflow_dispatch) のみ**
#   - concurrency で古い実行は自動キャンセル (同ブランチへの連続 push で二重消費しない)
#
# 手動 exe ビルド: GitHub → Actions → Build & Verify → Run workflow

name: Build & Verify

on:
  push:
    branches: ["arena/**", "main"]
    paths-ignore:
      - "**.md"
      - "ci/**"
      - "AUDIT*"
      - "bench-downloads/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check / clippy / fmt (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rsift
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo clippy (warnings are informational, errors fail)
        run: cargo clippy --workspace --all-targets --locked

  windows-installer:
    name: Rsift-1.21.11-Setup.exe (Windows) — 手動実行のみ
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - name: Build setup exe (DLLs -> jar -> launcher -> installer)
        shell: cmd
        run: tools\build_windows_setup_exe.bat
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: rsift-windows-binaries
          path: rsift/windows_binaries/
          if-no-files-found: error
          retention-days: 30
